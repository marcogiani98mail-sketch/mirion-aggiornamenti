<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05040b">
  <title>Mirion Fit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icona.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mirion Fit">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="stile.css">
  <link rel="stylesheet" href="cruscotto.css">
  <link rel="stylesheet" href="piatto.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="premium-sfuma" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--verde)"/><stop offset="1" style="stop-color:var(--accento-2)"/></linearGradient><linearGradient id="premium-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--verde);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--verde);stop-opacity:0"/></linearGradient></defs></svg>
  <header class="testata">
    <button type="button" id="indietro" class="indietro" aria-label="Indietro" hidden>‹</button>
    <a class="marchio" href="#/diario"><img src="icona.svg" alt="" width="30" height="30"> <span class="marchio-testo"><b class="nome-app">Mirion Fit</b><small id="dove"></small></span></a>
    <a id="al-trainer" class="al-trainer" hidden title="Torna a Mirion Trainer">Trainer</a>
    <span id="chi" class="chi"></span>
  </header>
  <div id="avviso-demo" class="avviso-demo" hidden><span>Stai guardando la <b>demo dell'area</b>: persone e numeri inventati.</span> <button type="button" data-az="esci-demo">Esci dalla demo</button></div>
  <main id="schermo" class="schermo" tabindex="-1"></main>
  <nav class="barra" aria-label="Sezioni">
    <a href="#/diario" data-sez="diario"><span class="ico"></span><span class="testo">Diario</span></a>
    <a href="#/allena" data-sez="allena"><span class="ico"></span><span class="testo">Allena</span></a>
    <a href="#/peso" data-sez="peso"><span class="ico"></span><span class="testo">Peso</span></a>
    <a href="#/area" data-sez="area"><span class="ico"></span><span class="testo">Trainer</span></a>
    <a href="#/io" data-sez="io"><span class="ico"></span><span class="testo">Io</span></a>
  </nav>
  <dialog id="foglio" class="foglio"></dialog>
  <div id="notifica" class="notifica" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
